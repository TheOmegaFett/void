name: Reusable - Deploy Cloud Run

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
    secrets:
      GCP_PROJECT_ID:
        required: true
      GCP_REGION:
        required: true
      ARTIFACT_REPO:
        required: true
      GCP_WIF_PROVIDER:
        required: true
      GCP_SERVICE_ACCOUNT_EMAIL:
        required: true
      CLOUD_RUN_SERVICE:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth to Google Cloud (OIDC)
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          create_credentials_file: true

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Validate Artifact Registry repo location
        run: |
          echo "Expecting registry host: ${{ secrets.GCP_REGION }}-docker.pkg.dev"
          gcloud artifacts repositories describe "${{ secrets.ARTIFACT_REPO }}" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --location "${{ secrets.GCP_REGION }}" \
            --format="value(name)" >/dev/null

      - name: Login to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build + push image (commit SHA = revision preservation)
        run: |
          IMAGE_URI="${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.ARTIFACT_REPO }}/void-flow:${{ github.sha }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"

      - name: Deploy to Cloud Run (creates new revision)
        run: |
          SAFE_REPO_LABEL="$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_-]#-#g' | cut -c1-63)"
          if [[ -z "$SAFE_REPO_LABEL" ]]; then SAFE_REPO_LABEL="repo"; fi

          gcloud run deploy "${{ secrets.CLOUD_RUN_SERVICE }}" \
            --image "$IMAGE_URI" \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --region "${{ secrets.GCP_REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=${{ inputs.environment }}" \
            --labels "env=${{ inputs.environment }},commit=${{ github.sha }},repo=${SAFE_REPO_LABEL}" \
            --quiet
